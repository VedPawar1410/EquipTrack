[pytest]
testpaths = tests
# Make `import app` / `from tests.conftest import ...` work with the plain `pytest` command.
pythonpath = .
asyncio_mode = auto
# One event loop for the whole run: the async engine and its pooled connections are bound to a loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
