name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check app tests evals

  test:
    # Pytest starts its own Postgres + Liquibase containers (testcontainers); the runner has Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Pre-pull test images
        run: docker pull -q pgvector/pgvector:pg16 && docker pull -q liquibase/liquibase:4.29
      - name: Run tests (fails below 95% coverage)
        run: pytest --cov --cov-report=term --cov-fail-under=95

  docker:
    # End-to-end: the real compose stack (Postgres -> Liquibase -> API image) must come up healthy
    # and serve an authenticated request, exactly as a developer or the deploy would run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "API never became healthy"; exit 1
      - name: Create an admin and call a protected endpoint
        run: |
          docker compose exec -T -e ADMIN_PASSWORD=ci-admin-password app \
            python -m app.create_admin --username ci-admin --email ci-admin@example.com
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/login \
            -d username=ci-admin -d password=ci-admin-password | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/v1/auth/me
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/equipment)" = "401"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api-contract:
    # The frontend's TypeScript types are generated from the API's OpenAPI schema. If a backend change
    # alters the contract without the types being regenerated (and the frontend type-checked), fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python scripts/export_openapi.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run gen:api
        working-directory: frontend
      - name: Committed contract matches the API
        run: git diff --exit-code frontend/src/lib/api/openapi.json frontend/src/lib/api/schema.d.ts
